[package]
name = "software-hub-tauri"
version = "0.7.4"
edition = "2021"
build = "build.rs"

[lib]
name = "software_hub_tauri_lib"
# Windows desktop only: the executable links this library as an rlib.
# Avoid unnecessary cdylib/staticlib targets and MSVC DLL import libraries.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
regex = "1"
fancy-regex = "0.16"
open = "5"
arboard = "3"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "s"
